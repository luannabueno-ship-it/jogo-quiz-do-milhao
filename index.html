<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show do Milhão TGDQ - Edição Kahoot & Roleta</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root {
      --bg-purple: #46178f;
      --card-bg: #5a1ea6;
      --red: #e21b3c;
      --blue: #1368ce;
      --yellow: #d89e00;
      --green: #26890c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
    
    body {
      background-color: var(--bg-purple);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    h1 { font-size: 2.2rem; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; }
    p.subtitle { font-size: 1.1rem; opacity: 0.9; margin-bottom: 20px; }

    /* TELAS */
    .screen { display: none; flex-direction: column; align-items: center; width: 100%; }
    .screen.active { display: flex; animation: fadeIn 0.4s ease-in-out; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* INPUT DE JOGADORES */
    .player-input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 400px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      outline: none;
    }
    .btn-add {
      background: var(--green);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .player-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 25px;
      width: 100%;
    }
    .player-tag {
      background: rgba(255,255,255,0.2);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-main {
      background: var(--yellow);
      color: #000;
      border: none;
      padding: 15px 40px;
      font-size: 1.3rem;
      font-weight: 900;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 5px 0 #9e7300;
      transition: all 0.1s;
    }
    .btn-main:active { transform: translateY(4px); box-shadow: none; }
    .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ROLETA */
    .wheel-container {
      position: relative;
      margin: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #wheelCanvas {
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .wheel-pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid white;
      z-index: 10;
    }

    /* PLACAR & TURNO */
    .turn-bar {
      width: 100%;
      background: rgba(0,0,0,0.2);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .current-player { font-size: 1.3rem; font-weight: 900; color: var(--yellow); }

    /* PERGUNTA & KAHOOT BUTTONS */
    .question-box {
      background: white;
      color: #333;
      padding: 25px;
      border-radius: 15px;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 25px;
      width: 100%;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 100%;
    }
